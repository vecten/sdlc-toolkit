# =============================================================
# skills-config.yaml — auto-generated by bootstrap-config skill
# Location: <workspace>/.cursor/skills-config.yaml
#
# This file is the single source of truth for all sdlc-toolkit
# skills. Run `bootstrap-config` to generate or update it.
# =============================================================

# --- Tool integrations ---
# Declare which external tools the project uses. Skills read these keys
# to decide which MCP tools to call and how to phrase instructions.
# Supported values:
#   pm_tool:             linear | jira | shortcut
#   knowledge_base_tool: notion | confluence
#   error_tracking_tool: sentry
pm_tool: "linear"
knowledge_base_tool: "notion"
error_tracking_tool: "sentry"

# --- Available repositories ---
# Each entry is validated on bootstrap: paths must exist, remotes are resolved.
# Skills detect the current repo from CWD by matching against these paths.
repos:
  my-app:
    path: "my-app"                         # relative to workspace root
    remote: "git@github.com:org/my-app.git"
    github_org: "org"
  my-api:
    path: "my-api"
    remote: "git@github.com:org/my-api.git"
    github_org: "org"

# --- Git ---
# Branch names are per-repo. Skills look up git.branches.<repo-key>.
git:
  branches:
    my-app:
      dev: "dev"                           # the branch to base work on
      release_target: "production"         # where releases are merged to
    my-api:
      dev: "main"
      release_target: "main"
  branch_prefixes:
    feature: "feature/"
    bugfix: "bugfix/"
    hotfix: "hotfix/"
  commit_prefix_pattern: "<TICKET_ID>: <message>"
  custom_input: |
    # Any repo-specific git conventions. Examples:
    # - Squash merges only on my-app
    # - Rebase workflow on my-api

# --- Linear ---
linear:
  team_name: "My Team"
  team_id: null                            # resolved by bootstrap-config
  default_project: "My Project"
  default_project_id: null                 # resolved by bootstrap-config
  projects:
    - name: "My Project"
      id: null
  labels:
    - name: "Bug"
      id: null
    - name: "Feature"
      id: null
  default_priority: 3                      # 1=Urgent, 2=High, 3=Medium, 4=Low
  ticket_prefix: "PROJ"                    # used for commit prefixes and ticket extraction
  custom_input: |
    # E.g.: default cycle rules, label selection logic, assignee defaults

# --- Slack ---
slack:
  channels:
    review: "#dev"                         # channel for PR notifications
    release: "#dev"                        # channel for release notifications
  reviewers:
    - name: "Jane Doe"
      slack_id: null                       # resolved by bootstrap-config via slack_search_users
    - name: "John Smith"
      slack_id: null
  notify_on_pr: true
  notify_on_release: true
  custom_input: |
    # E.g.: different channels per repo, additional people to cc

# --- Testing ---
testing:
  runner: "docker"                         # "docker" | "host" | "ci-only"
  prefer_makefile: true
  custom_input: |
    # Per-repo test commands and special instructions. Examples:
    # my-app:
    #   - migration_command: "make migrations"
    #   - test: "make tests"
    #   - lint: "make format"
    # my-api:
    #   - test: "npm test"
    #   - lint: "npm run lint"

# --- Notion ---
notion:
  priorities_statuses:
    - "On Track"
    - "Planned"
    - "At Risk"
    - "Blocked"
    - "Done"
  priorities_database_id: null             # cached after first discovery
  custom_input: |
    # E.g.: additional properties, custom view names, subpage scaffold

# --- Release email ---
release_email:
  greeting: "Hi,"
  sign_off: "Best regards"
  enabled: true
  custom_input: |
    # System display names, recipients, subject format, tone. Examples:
    # my-app: "My Application"
    # my-api: "API Platform"
    # subject_pattern: "Release Update — {date}"
    # recipients: "client-team@example.com"
    # Include internal changes: false

# --- Timeline ---
# Used by manage-timeline to keep project dates current.
# Optional — the skill will offer to bootstrap this section if missing.
timeline:
  developers: 1                              # team capacity; drives scheduling
  scheduling: "sequential"                   # "sequential" | "parallel" | "custom"
  ongoing_projects: []                       # project names that never get auto-scheduled dates
  execution_order:                           # ordered list of project names; top = current
    - "My Project"
  parallel_groups: []                        # groups of projects that share a lane and overlap
  no_target_date: []                         # project names to skip when auto-dating
  custom_input: |
    # Additional scheduling rules. Examples:
    # - Always keep 1-week buffer between projects
    # - Holidays: skip 2026-12-24 to 2027-01-01
